<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多邮箱聚合摘要工具</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-badge">📬</span><span class="brand-name">邮件聚合</span><span class="brand-kicker">Daily Mail Digest</span></div>
    <div id="account-tabs" class="account-tabs"></div>
    <div class="topbar-actions">
      <input id="search" class="search" type="search" placeholder="搜索主题 / 正文 / 公司 / 附件名" />
      <button id="btn-sync" class="btn btn-primary">立即同步</button>
      <button id="btn-rules" class="btn">规则配置</button>
      <button id="btn-summary-cfg" class="btn" title="外观与 AI 设置">⚙ 设置</button>
      <button id="btn-add" class="btn">＋ 添加账号</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-group">
        <div class="side-title">视图</div>
        <button class="side-item" data-view="all">全部邮件</button>
        <button class="side-item" data-view="inbox">收件箱</button>
        <button class="side-item" data-view="junk">垃圾邮件</button>
        <button class="side-item" data-view="other">其他邮件</button>
        <button class="side-item" data-view="unread">未读</button>
        <button class="side-item" data-view="starred">已加星</button>
        <button class="side-item" data-view="companies">按公司</button>
        <button class="side-item" data-view="digest">摘要</button>
      </div>
      <div class="side-group">
        <div class="side-title">账号</div>
        <div id="side-accounts"></div>
      </div>
      <div class="side-group" data-group="categories">
        <div class="side-title" data-toggle="categories">
          <span class="side-label"><span class="side-caret">▾</span>分类</span>
          <button class="side-add" id="btn-cat-add" title="新增分类">＋</button>
        </div>
        <div id="side-categories"></div>
      </div>
      <div class="side-group" data-group="tags">
        <div class="side-title" data-toggle="tags">
          <span class="side-label"><span class="side-caret">▾</span>标签</span>
        </div>
        <div id="side-tags"></div>
      </div>
      <div class="side-group" data-group="companies">
        <div class="side-title" data-toggle="companies">
          <span class="side-label"><span class="side-caret">▾</span>公司</span>
        </div>
        <div id="side-companies"></div>
      </div>
    </aside>

    <main class="main">
      <div class="list-toolbar">
        <label class="chk"><input type="checkbox" id="check-all" /> 全选</label>
        <span id="list-count" class="muted"></span>
        <div class="spacer"></div>
        <select id="tag-select" class="tag-select" title="选择标签"></select>
        <button class="btn btn-sm" id="btn-tag-add">＋标签</button>
        <button class="btn btn-sm" id="btn-tag-remove">－标签</button>
        <button class="btn btn-sm" data-bulk="read">标记已读</button>
        <button class="btn btn-sm" data-bulk="star">加星</button>
        <button class="btn btn-sm" data-bulk="archive">归档</button>
        <button class="btn btn-sm" id="btn-all-read" title="把当前视图筛选出的邮件全部标记为已读">一键已读</button>
        <button class="btn btn-sm btn-danger" id="btn-all-delete" title="删除当前视图筛选出的全部邮件（仅从本工具移除）">一键删除</button>
      </div>
      <div id="message-list" class="message-list"></div>
    </main>

    <section id="detail" class="detail empty">选择一封邮件查看详情</section>
    <button id="detail-toggle" class="detail-toggle" title="收起详情">❯</button>
  </div>

  <!-- 添加账号弹窗 -->
  <div id="modal" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>添加邮箱账号</h3>
        <button id="modal-close" class="btn btn-sm">关闭</button>
      </div>
      <form id="account-form" class="modal-body">
        <label>邮箱类型
          <select id="f-provider"></select>
        </label>
        <p id="f-hint" class="hint"></p>
        <label>展示名 <input id="f-name" placeholder="如：工作邮箱" required /></label>
        <label>邮箱地址 <input id="f-email" type="email" placeholder="you@example.com" required /></label>
        <label><span id="f-cred-label">授权码</span> <input id="f-secret" type="password" /></label>
        <div id="f-oauth" class="hidden">
          <label>OAuth Client ID <input id="f-client-id" placeholder="Google / Azure 应用的 Client ID" /></label>
          <label>OAuth Client Secret <input id="f-client-secret" type="password" placeholder="公开客户端可留空" /></label>
          <p class="hint">保存后将自动打开授权页；授权完成回到本页即可。回调地址见下方提示。</p>
        </div>
        <details>
          <summary>高级（服务器地址，可留空使用默认）</summary>
          <label>IMAP 服务器 <input id="f-host" placeholder="留空使用默认" /></label>
          <label>端口 <input id="f-port" type="number" placeholder="993" /></label>
        </details>
        <div id="form-msg" class="form-msg"></div>
        <div class="modal-actions">
          <button type="button" id="btn-test" class="btn">测试连接</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
        <p id="f-redirect" class="hint"></p>
      </form>
    </div>
  </div>

  <!-- 规则配置弹窗 -->
  <div id="rules-modal" class="modal-mask hidden">
    <div class="modal modal-wide">
      <div class="modal-head">
        <h3>分类规则配置</h3>
        <button id="rules-close" class="btn btn-sm">关闭</button>
      </div>
      <div class="modal-body">
        <div class="cfg-grid">
          <label>重要阈值 <input id="cfg-important" type="number" min="0" /></label>
          <label>待办阈值 <input id="cfg-todo" type="number" min="0" /></label>
        </div>
        <div class="cfg-grid">
          <label>白名单权重 <input id="w-whitelist" type="number" min="0" /></label>
          <label>实体权重 <input id="w-entities" type="number" min="0" /></label>
          <label>回复权重 <input id="w-reply" type="number" min="0" /></label>
          <label>收件我权重 <input id="w-to_me" type="number" min="0" /></label>
          <label>附件权重 <input id="w-attachment" type="number" min="0" /></label>
        </div>
        <label>重要联系人白名单（每行一个邮箱或域名，如 boss@corp.com 或 corp.com）
          <textarea id="cfg-whitelist" rows="3" placeholder="boss@corp.com&#10;vip.com"></textarea>
        </label>

        <div class="rules-head">
          <b>评分规则</b>
          <button id="rule-add" class="btn btn-sm">＋ 新增规则</button>
        </div>
        <div id="rules-table" class="rules-table"></div>

        <div id="rules-msg" class="form-msg"></div>
        <div class="modal-actions">
          <button id="rules-reset" class="btn">恢复默认规则</button>
          <button id="btn-reclassify" class="btn">重新分类全部邮件</button>
          <button id="rules-save" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 公司合并弹窗 -->
  <div id="merge-modal" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-head">
        <h3 id="merge-title">合并公司</h3>
        <button id="merge-close" class="btn btn-sm">关闭</button>
      </div>
      <div class="modal-body">
        <p class="hint">勾选要并入的公司，其域名、联系人、邮件将全部转移到当前公司。</p>
        <div id="merge-list" class="merge-list"></div>
        <div class="modal-actions">
          <button id="merge-confirm" class="btn btn-primary">确认合并</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 通用输入/确认弹窗（替代原生 prompt/confirm，兼容桌面 WebView） -->
  <div id="ask-modal" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-head">
        <h3 id="ask-title">提示</h3>
        <button id="ask-close" class="btn btn-sm">关闭</button>
      </div>
      <div class="modal-body">
        <p id="ask-msg" class="hint"></p>
        <label id="ask-field"><input id="ask-input" placeholder="请输入" /></label>
        <div class="modal-actions">
          <button id="ask-cancel" class="btn">取消</button>
          <button id="ask-ok" class="btn btn-primary">确定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置弹窗：外观（风格 / 主题 / 字号 / 背景）+ AI 摘要 -->
  <div id="summary-modal" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>设置</h3>
        <button id="summary-close" class="btn btn-sm">关闭</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <div class="settings-title">外观</div>
          <label>界面风格
            <select id="design-select">
              <option value="flow">极简工作台 · 生产力（暗色荧光绿）</option>
              <option value="editorial">编辑部 · 报刊杂志（暖纸衬线）</option>
              <option value="glass">玻璃拟态 · 紫罗兰（柔光通透）</option>
              <option value="terminal">终端控制台 · 极客（CRT 荧光）</option>
            </select>
          </label>
          <label>明暗主题
            <select id="theme-select">
              <option value="auto">🖥 跟随系统</option>
              <option value="light">☀️ 浅色</option>
              <option value="dark">🌙 深色</option>
            </select>
          </label>
          <label>邮件字号
            <select id="font-size-select">
              <option value="13">字号 · 小</option>
              <option value="14">字号 · 标准</option>
              <option value="16">字号 · 大</option>
              <option value="18">字号 · 特大</option>
            </select>
          </label>
          <div class="settings-preview">
            <div class="sp-subject">季度结算通知 · 请于本周内确认</div>
            <div class="sp-body">尊敬的客户，您的账户已完成本季度结算，明细见附件，如有疑问请及时回复。</div>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-title">AI 摘要</div>
          <label class="chk"><input type="checkbox" id="llm-enabled" /> 启用 LLM 摘要（关闭时仅用规则摘要）</label>
          <label>服务类型
            <select id="llm-provider">
              <option value="openai">OpenAI / 兼容接口（含代理）</option>
              <option value="ollama">本地 Ollama</option>
            </select>
          </label>
          <label>接口地址 <input id="llm-base" placeholder="https://api.openai.com/v1" /></label>
          <label>模型 <input id="llm-model" placeholder="gpt-4o-mini / llama3.1" /></label>
          <label>API Key <input id="llm-key" type="password" placeholder="留空不设置" /></label>
          <div class="cfg-grid">
            <label>正文截断字数 <input id="llm-maxchars" type="number" min="500" /></label>
            <label>超时（秒） <input id="llm-timeout" type="number" min="1" /></label>
          </div>
          <p class="hint">未配置或调用失败时自动降级为规则摘要，功能始终可用；Key 加密存储。</p>
        </div>

        <div id="summary-msg" class="form-msg"></div>
        <div class="modal-actions">
          <button id="summary-save" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
